<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tit.js playground</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #eef2f7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 24px; background: #fff; border-bottom: 1px solid #dbe3ee; }
      h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
      .tagline { color: #64748b; font-size: 13px; }
      main { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; padding: 16px; height: calc(100vh - 66px); }
      .panel { min-height: 0; overflow: hidden; background: #fff; border: 1px solid #dbe3ee; border-radius: 14px; box-shadow: 0 8px 28px rgb(15 23 42 / 7%); }
      .editor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-bottom: 1px solid #e5eaf1; }
      button { appearance: none; border: 1px solid #d1d9e5; border-radius: 8px; background: #fff; color: #334155; padding: 7px 10px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
      button:hover { border-color: #818cf8; color: #4338ca; }
      textarea { width: 100%; height: 100%; resize: none; border: 0; outline: 0; padding: 16px; color: #dbeafe; background: #111827; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 2; }
      .hint { padding: 10px 13px; color: #64748b; background: #f8fafc; border-top: 1px solid #e5eaf1; font-size: 11px; line-height: 1.5; }
      .stage { display: grid; grid-template-rows: auto minmax(0, 1fr); }
      .stage .toolbar { justify-content: flex-end; }
      #diagram { overflow: auto; padding: 20px; min-height: 0; background-color: #f8fafc; background-image: radial-gradient(#cbd5e1 0.7px, transparent 0.7px); background-size: 18px 18px; }
      #diagram svg { min-width: 0; border-radius: 10px; box-shadow: 0 6px 24px rgb(15 23 42 / 8%); }
      .error { display: none; margin-right: auto; color: #b91c1c; font-size: 12px; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } .editor { height: 430px; } .stage { min-height: 520px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Tit.js <span class="tagline">— Draw.io quality at Mermaid speed.</span></h1>
      <span class="tagline">Fast. Beautiful. Editable.</span>
    </header>
    <main>
      <section class="panel editor">
        <div class="toolbar">
          <button id="deployment">Deployment</button>
          <button id="sequence">Sequence</button>
          <button id="flowchart">Flowchart</button>
          <button id="state">State</button>
          <button id="er">ER</button>
          <button id="component">Component</button>
          <button id="slide">Slide</button>
          <button id="class">Class</button>
          <button id="usecase">Use Case</button>
          <button id="activity">Activity</button>
        </div>
        <textarea id="source" spellcheck="false" aria-label="Diagram source"></textarea>
        <div class="hint">DSLを編集すると即時更新。Nodeをドラッグ、Ctrl/⌘+クリックで複数選択、ダブルクリックでPin。Ctrl/⌘+ホイールで拡縮、Space/Alt+ドラッグでPan。</div>
      </section>
      <section class="panel stage">
        <div class="toolbar">
          <span id="error" class="error"></span>
          <button id="zoom-out" aria-label="Zoom out">−</button>
          <button id="zoom-value" aria-label="Reset zoom to 100%">100%</button>
          <button id="zoom-in" aria-label="Zoom in">＋</button>
          <button id="fit-diagram">Fit</button>
          <button id="fit-width">Width</button>
          <button id="pin">Pin / Unpin</button>
          <button id="layout">Auto layout</button>
          <button id="save">Save layout</button>
        </div>
        <div id="diagram"></div>
      </section>
    </main>
    <script src="../dist/tit.global.js?v=0.1.0-viewport-1"></script>
    <script src="./playground.js"></script>
  </body>
</html>
