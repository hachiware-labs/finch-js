<!doctype html><html lang="ja"><meta charset="utf-8"><title>Activity split — Finch.js</title>
<style>body{font:15px sans-serif;background:#f3f6fb;padding:32px}main{background:white;padding:24px;max-width:1000px;margin:auto}.diagram{overflow:auto}</style>
<main><h1>独立した経路への分岐</h1><p>監査は記録したところで経路を終了し、メールと通知だけが合流へ進みます。合流は同期を待つjoinではありません。</p><div id="split" class="diagram" aria-label="独立した分岐と経路の終了"></div></main>
<script src="../dist/finch.global.js"></script><script>
const splitSource = `@activity
start begin
split dispatch {
 branch {
  action email "Send email"
 }
 branch {
  action audit "Record audit"
  flowfinal auditDone
 }
 branch {
  action notify "Notify user"
 }
}
end done
begin -> dispatch
dispatch.done -> done`;
Finch.render(splitSource,{target:'#split'});
</script></html>
