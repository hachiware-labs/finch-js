<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js UML activity example</title><link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Activity">
    <header><a class="back" href="./index.html">← All examples</a><span class="eyebrow">@activity</span><h1>UML activity diagram</h1><p>Actions, guards, decisions, merge points, fork/join bars, and object nodes.</p></header>
    <main class="diagram-layout"><section id="diagram" class="canvas" aria-label="Activity diagram output"></section><p id="error" class="error" hidden></p></main>
    <script src="../dist/finch.global.js?v=0.5.1-uml-1"></script>
    <script>
      const activitySource = String.raw`
@activity

start begin
action receive "Receive order"
action validate "Validate request"
decision valid "Valid?"
action reject "Record rejection"
fork parallel
action reserve "Reserve inventory"
action score "Run fraud checks"
object order "Order"
join prepared
decision approved "Approved?"
action charge "Capture payment"
action release "Release inventory"
merge outcome "Outcome"
action notify "Notify customer"
end done

begin -> receive
receive -> validate
validate -> valid
valid -> reject [invalid] / record reason
valid -> parallel [valid]
parallel -> reserve
parallel -> score
reserve -> order: updates
order -> prepared
score -> prepared
prepared -> approved
approved -> charge [yes]
approved -> release [no]
charge -> outcome
release -> outcome
reject -> outcome
outcome -> notify
notify -> done
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(activitySource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
