<!doctype html><html lang="ja"><meta charset="utf-8"><title>Namespaces — Finch.js</title>
<style>body{font:15px sans-serif;background:#f3f6fb;padding:32px}main{background:white;padding:24px;max-width:1100px;margin:auto}.diagram{overflow:auto}</style>
<main><h1>同じ名前を異なる領域で使う</h1><p>billing.Modelとshipping.Modelを別のクラスとして扱います。領域内の参照は短い名前で書けます。同じnamespaceを再び開き、クラスを分けて追加できます。</p><div id="namespaces" class="diagram" aria-label="請求と配送の名前空間"></div></main>
<script src="../dist/finch.global.js"></script><script>
const namespaceSource = `@class
namespace billing "Billing" {
 class Service {
  +invoice()
 }
 Service --> Model
}
namespace shipping "Shipping" {
 class Service {
  +dispatch()
 }
 class Model {
  +address: String
 }
 Service --> Model
 Service ..> billing.Service
}
class billing.Model {
 +total: Money
}`;
Finch.render(namespaceSource,{target:'#namespaces'});
</script></html>
