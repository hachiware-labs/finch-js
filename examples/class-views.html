<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クラス図の表示範囲 — Finch.js</title>
<style>body{background:#f3f6fb;color:#24334b;font:15px Segoe UI,Meiryo,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:32px}section{background:white;padding:24px;border-radius:12px;margin:24px 0}.diagram{overflow:auto}</style>
<main><a href="objects-templates.html">← オブジェクトとテンプレート</a><h1>同じモデルから表示を切り替える</h1><section><h2>詳細な設計図</h2><div id="full" class="diagram" aria-label="すべてのメンバー"></div></section><section><h2>公開APIだけの図</h2><p>属性と非公開メンバーを隠し、Auditを図から除いています。元の宣言は保持されます。</p><div id="public" class="diagram" aria-label="公開APIのビュー"></div></section><section><h2>メンバーへの注釈</h2><div id="members" class="diagram" aria-label="属性と操作に直接付けた注釈"></div></section></main>
<script src="../dist/finch.global.js"></script><script>
const classSource = `@class
class Account {
 -secret: String
 +name: String
 +save()
 -validate()
}
interface Repository<T> {
 +find(id): T
 +save(value: T)
}
class Audit {
 +record()
}
Account ..> Repository
Account --> Audit`;
Finch.render(classSource,{target:'#full'});
const publicSource=classSource+'\nhide fields\nhide private members\nhide Audit\nhide empty members';
Finch.render(publicSource,{target:'#public'});
const memberSource = `@class
class Account {
 -balance: Money
 +save()
 +save(force: Boolean)
}
note Account::balance "Must remain nonnegative"
note Account::save(force: Boolean) "Force mode bypasses the cache"`;
Finch.render(memberSource,{target:'#members'});
</script></html>
