<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js UML class example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Class">
    <header><a class="back" href="./index.html">← All examples</a><span class="eyebrow">@class</span><h1>UML class diagram</h1><p>Classifiers, members, visibility, inheritance, realization, dependencies, composition, and multiplicities.</p></header>
    <main class="diagram-layout"><section id="diagram" class="canvas" aria-label="Class diagram output"></section><p id="error" class="error" hidden></p></main>
    <script src="../dist/finch.global.js?v=0.5.1-uml-1"></script>
    <script>
      const classSource = String.raw`
@class

interface Repository {
  +find(id: UUID): Entity
  +save(entity: Entity): void
}

interface PaymentGateway {
  +authorize(amount: Money): Authorization
  +capture(id: UUID): Receipt
}

abstract AggregateRoot {
  #version: integer
  +record(event: DomainEvent): void
}

enum OrderStatus {
  DRAFT
  CONFIRMED
  PAID
  CANCELLED
}

class Order {
  -id: UUID
  -status: OrderStatus
  -items: LineItem[]
  +addItem(product: Product, quantity: int): void
  +confirm(): void
  +total(): Money
}

class LineItem {
  -quantity: int
  -unitPrice: Money
  +subtotal(): Money
}

class OrderRepository {
  -database: Database
  +find(id: UUID): Order
  +save(order: Order): void
}

class CheckoutService {
  -orders: Repository
  -payments: PaymentGateway
  +checkout(orderId: UUID): Receipt
}

Order --|> AggregateRoot
Order "1" *-- "1..N" LineItem: items
Order --> OrderStatus: status
OrderRepository ..|> Repository
OrderRepository ..> Order: persists
CheckoutService ..> Repository: loads
CheckoutService ..> PaymentGateway: authorizes
CheckoutService ..> Order: confirms
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(classSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
