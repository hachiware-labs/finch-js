<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js advanced deployment example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Deployment">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@deployment</span>
      <h1>Advanced deployment</h1>
      <p>Nested platform boundaries with stable IDs and aggregated telemetry.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Deployment diagram output"></section>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/finch.global.js?v=0.5.1-examples-2"></script>
    <script>
      const deploymentSource = String.raw`
@deployment

' Stable IDs stay short; labels can change without losing layout.
node web "Web Client" [shape=rounded channel=public]
node mobile "Mobile Client" [shape=rounded channel=public]

container platform "Production Platform" [layout=grid columns=2] {
  device edgebox "Edge Appliance" [row=1 column=1]
  artifact release "orders-service:v42" [row=1 column=2]
  execution runtime "Container Runtime" [row=2 column=1]
  container ingress "Ingress Tier" [layout=column row=2 column=2] {
    server cdn "Global CDN"
    server waf "Web Application Firewall"
    server gateway "API Gateway"
  }

  container services "Service Tier" [layout=column row=3 column=1] {
    server identity "Identity Service" [owner=security]
    server orders "Order Service" [owner=commerce]
    server worker "Async Worker" [owner=platform]
  }

  container data "Data Tier" [layout=grid columns=2 row=3 column=2] {
    database users "User Database"
    database orderdb "Order Database"
    database cache "Redis Cache"
    server queue "Event Queue"
    server objects "Object Storage"
  }
}

container observe "Observability" [layout=column place=below] {
  server metrics "Metrics"
  server logs "Log Store"
  server traces "Distributed Tracing"
}

web -> cdn: HTTPS
mobile -> cdn: API
edgebox -> cdn: routes
cdn -> waf
waf -> gateway
gateway -> identity: authenticate
gateway -> orders: commands
release ..> runtime: deployed to
runtime -> orders: executes
identity -> users
orders -> cache
orders -> orderdb
orders -> queue: OrderCreated
queue -> worker
worker -> objects
platform --> observe: telemetry
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(deploymentSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
