<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tit.js advanced flowchart example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Flowchart" data-source="flowchart-advanced.tit">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@flowchart</span>
      <h1>Advanced flowchart</h1>
      <p>Decision branches, exceptional paths, compensation, and retry cycles.</p>

    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Diagram output"></section>
      <details><summary>Show flowchart-advanced.tit</summary><pre id="source"></pre></details>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/tit.global.js?v=0.1.0-examples-2"></script>
    <script src="./example-page.js"></script>
