<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js advanced flowchart example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Flowchart">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@flowchart</span>
      <h1>Advanced flowchart</h1>
      <p>Decision branches, exceptional paths, compensation, and retry cycles.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Flowchart diagram output"></section>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/finch.global.js?v=0.5.1-examples-2"></script>
    <script>
      const flowchartSource = String.raw`
@flowchart

start begin "Request received"
input payload "Read payload"
process normalize "Normalize fields"
decision valid "Schema valid?"
process reject "Record validation error"
decision risk "Risk acceptable?"
process review "Manual review"
decision approved "Review approved?"
process execute "Execute transaction"
decision settled "Settlement complete?"
output receipt "Send receipt"
process compensate "Run compensation"
end success "Completed"
end failure "Rejected"

begin -> payload
payload -> normalize
normalize -> valid
valid -> risk: Yes
valid -> reject: No
reject -> failure
risk -> execute: Low risk
risk -> review: Review
review -> approved
approved -> execute: Yes
approved -> normalize: Retry
approved -> failure: No
execute -> settled
settled -> receipt: Yes
settled --> compensate: Timeout
compensate -> execute: Retry
compensate -> failure: Abort
receipt -> success
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(flowchartSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
