<!doctype html><html lang="ja"><meta charset="utf-8"><title>Object maps — Finch.js</title>
<style>body{font:15px sans-serif;background:#f3f6fb;padding:32px}main{background:white;padding:24px;max-width:1100px;margin:auto}.diagram{overflow:auto}</style>
<main><h1>キーからオブジェクトを参照する</h1><p>mapはキーと値の表です。行からの参照も、別オブジェクトから特定の行への接続も表せます。</p><div id="maps" class="diagram" aria-label="首都の辞書と都市オブジェクト"></div></main>
<script src="../dist/finch.global.js"></script><script>
const mapSource = `@object
object request "request : Lookup" {
 country = UK
}
map capitals "capitals : Map" {
 UK *-> london
 USA => Washington
 Germany => Berlin
 fallback =>
}
object london "London : City" {
 timezone = Europe/London
}
request --> capitals::UK: lookup`;
Finch.render(mapSource,{target:'#maps'});
</script></html>
