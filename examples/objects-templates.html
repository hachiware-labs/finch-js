<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オブジェクトとテンプレート — Finch.js</title>
<style>body{background:#f3f6fb;color:#24334b;font:15px Segoe UI,Meiryo,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:32px}section{background:white;padding:24px;border-radius:12px;margin:24px 0}.diagram{overflow:auto}</style>
<main><a href="uml-parity.html">← UML参照と分岐</a><h1>インスタンスと型を描き分ける</h1><section><h2>ある時点のオブジェクト構造</h2><div id="object" class="diagram" aria-label="オブジェクト図"></div></section><section><h2>型パラメーターを持つクラス</h2><div id="class" class="diagram" aria-label="ジェネリクスクラス"></div></section></main>
<script src="../dist/finch.global.js"></script><script>
const objectSource = `@object
object platform "platform : Team" {
 name = "Platform"
}
object alice "alice : User" {
 name = "Alice"
 active = true
}
object bob "bob : User" {
 name = "Bob"
 active = false
}
platform -- alice: member
platform -- bob: member`;
Finch.render(objectSource,{target:'#object'});
const classSource = `@class
interface Repository<K, V> {
 get(key: K): V
 save(value: V)
}
class UserRepository {
 get(key: String): User
 save(value: User)
}
UserRepository ..|> Repository`;
Finch.render(classSource,{target:'#class'});
</script></html>
