<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finch.js — click, drag, edit</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; color: #172033; font-family: system-ui, sans-serif; }
  .demo { max-width: 820px; min-height: 860px; margin: auto; padding: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
  .version { color: #687386; font-size: 13px; }
  #instruction { font-size: 19px; font-weight: 650; margin: 10px 0 18px; color: #be185d; }
  #diagram { background: white; border: 1px solid #dce3ec; border-radius: 14px; padding: 16px; }
  #diagram > svg { display: block; }
  footer { color: #64748b; font-size: 14px; margin-top: 14px; }
  #capture-cursor { position: fixed; pointer-events: none; z-index: 9999; width: 18px; height: 24px; filter: drop-shadow(0 1px 2px #888); }
</style>
<main class="demo">
  <header><h1>Finch.js</h1><span class="version">0.7.0</span></header>
  <p id="instruction">1. Click the pink Finch button to open the editor</p>
  <div id="diagram" aria-label="Application deployment diagram"></div>
  <footer id="hint">Drag nodes to arrange the diagram. Add services and connections in Source, then drag them into place.</footer>
</main>
<script src="../dist/finch.global.js"></script>
<script>
  const deploymentSource = `
@deployment
node browser "Web app" [icon=app-window]
container cloud "Production" [layout=row tone=cyan] {
  server api "API server" [icon=server]
  database db "PostgreSQL" [icon=database]
}
browser -> api
api -> db: SQL
  `.trim();
  const japanese = new URLSearchParams(location.search).get('lang') === 'ja';
  const localizedSource = japanese ? deploymentSource.replace('Web app', 'Webアプリ').replace('Production', '本番環境').replace('API server', 'APIサーバー') : deploymentSource;
  const diagram = Finch.render(localizedSource, { target: '#diagram' });
  if (japanese) {
    document.documentElement.lang = 'ja';
    document.querySelector('#instruction').textContent = '1. ピンクのFinchボタンをクリックして編集を開く';
    document.querySelector('#hint').textContent = 'ソースでサービスと接続を追加し、ノードをドラッグして配置を整えます。';
    document.querySelector('#diagram').setAttribute('aria-label', 'アプリケーションの配備図');
    const labels = { 'zoom-out': '縮小', 'zoom-in': '拡大', 'edit': '編集 ON', 'undo': '元に戻す', 'pin': '固定 / 解除', 'layout': '自動配置', 'reset': '配置をリセット', 'fit': '全体表示', 'width': '幅に合わせる', 'save': '保存' };
    const localizeEditor = () => {
      for (const [action, label] of Object.entries(labels)) document.querySelector('[data-action="' + action + '"]').textContent = action === 'edit' ? (diagram.editable ? '編集 ON' : '編集 OFF') : label;
      document.querySelector('.finch-editor__header strong').textContent = 'Finchエディター';
      document.querySelector('.finch-editor__source > span').textContent = 'ソース';
      const status = document.querySelector('.finch-editor__status');
      status.textContent = status.classList.contains('is-dirty') ? '未保存' : '保存済み';
    };
    document.querySelector('#diagram').addEventListener('finch:layoutchange', () => queueMicrotask(localizeEditor));
    document.querySelector('#diagram').addEventListener('finch:editchange', () => queueMicrotask(localizeEditor));
    document.querySelector('[data-source]').addEventListener('input', () => setTimeout(localizeEditor, 400));
    localizeEditor();
  }
  diagram.setZoom(0.85);
  document.querySelector('[data-action="save-as"]').textContent = japanese ? '名前を付けて保存' : 'Save as';
  document.querySelector('[data-action="freeze"]').textContent = japanese ? 'フリーズ' : 'Freeze';
</script>
</html>
