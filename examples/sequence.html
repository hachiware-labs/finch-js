<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js advanced sequence example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Sequence">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@sequence</span>
      <h1>Advanced sequence</h1>
      <p>Nested frames, activations, self messages, loops, and optional calls.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Sequence diagram output"></section>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/finch.global.js?v=0.5.1-examples-2"></script>
    <script>
      const sequenceSource = String.raw`
@sequence

actor Customer "Customer"
participant Web "Web App"
participant API "API Gateway"
participant Auth "Auth Service"
participant Session "Session DB"
participant Order "Order Service"
participant Inventory "Inventory"
participant Payment "Payment Provider"
participant Queue "Event Queue"

Customer -> Web: Place order
Web -> API: POST /orders

group Checkout transaction
  API -> Auth: Verify access token
  Auth -> Session: Load session
  Session --> Auth: Session data
  Auth --> API: Authorized

  alt Authorized request
    critical Create order atomically
      API -> Order: Create order
      Order -> Order: Calculate total
    end

    loop Reserve each item
      Order -> Inventory: Reserve SKU
      Inventory --> Order: Reserved
    end

    opt Payment required
      Order -> Payment: Authorize amount
      Payment --> Order: Authorization
    end

    par Publish checkout results
      Order -> Queue: OrderCreated
      Queue --> Order: Accepted
    end
    Order --> API: Order response
  end
end

break Client disconnected
  API --> Web: Abort response
end

API --> Web: 201 Created
Web --> Customer: Confirmation
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(sequenceSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
