<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js presentation story example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Slide story">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@slide</span>
      <h1>Presentation-ready story</h1>
      <p>A focused before/after narrative with one takeaway, sized to work as a single slide.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Slide story diagram output"></section>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/finch.global.js?v=0.5.1-slide-story-1"></script>
    <script>
      const slideStorySource = String.raw`
@slide

title "Stop redrawing architecture slides" [align=center]
subtitle "Keep one readable source. Generate the first layout, then refine only what matters." [align=center]

row transformation [gap=82] {
  card before "Before" [badge=MANUAL body="Slow updates.\nUneven spacing.\nIntent gets lost."]
  arrow: One source
  card finch "Finch.js" [badge=DSL+SVG body="One source.\nOne theme.\nOne layout." tone=accent]
  arrow: Human touch
  card after "After" [badge=EDITABLE body="Faster reviews.\nStable decisions.\nSVG anywhere."]
}

callout message "From architecture note to presentation-ready SVG." [body="Text owns the meaning. The layout overlay preserves deliberate visual choices." width=760]

grid uses [columns=4 gap=12] {
  badge docs "DOCUMENTATION"
  badge pitches "PITCHES"
  badge workshops "WORKSHOPS"
  badge reviews "DESIGN REVIEWS"
}
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(slideStorySource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
