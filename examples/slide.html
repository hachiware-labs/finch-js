<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tit.js presentation slide example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Slide" data-source="slide-advanced.tit">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@slide</span>
      <h1>Presentation diagram</h1>
      <p>Titles, narrative cards, automatic arrows, grids, notes, callouts, and badges composed as one slide.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Diagram output"></section>
      <details><summary>Show slide-advanced.tit</summary><pre id="source"></pre></details>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/tit.global.js?v=0.1.0-slide-1"></script>
    <script src="./example-page.js?v=2"></script>
  </body>
</html>
