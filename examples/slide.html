<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js presentation slide example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Slide">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@slide</span>
      <h1>Presentation diagram</h1>
      <p>Titles, narrative cards, automatic arrows, grids, notes, callouts, and badges composed as one slide.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="Slide diagram output"></section>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/finch.global.js?v=0.5.1-slide-1"></script>
    <script>
      const slideSource = String.raw`
@slide

title "Finch.js — ideas become diagrams" [align=center]
subtitle "A concise DSL keeps the story structured, consistent, and editable." [align=center]

row journey [gap=76] {
  card source "Describe" [badge=STEP-1 body="Write the intent in a few readable lines."]
  arrow: Structure
  card compose "Compose" [badge=STEP-2 body="Rows, grids, and relationships arrange themselves." tone=accent]
  arrow: Refine
  card present "Present" [badge=STEP-3 body="Adjust only what needs a human touch."]
}

grid strengths [columns=3 gap=22] {
  card fast "Fast to author" [body="Less time aligning boxes and arrows."]
  card consistent "Visually consistent" [body="One theme governs spacing, type, and color."]
  card editable "Still editable" [body="Drag, pin, and preserve intentional changes."]
  note syntax "Readable source" [body="The diagram remains understandable in code review."]
  note export "SVG output" [body="Sharp enough for decks, documents, and the web."]
  note extensible "Open vocabulary" [body="Add more presentation patterns over time."]
}

callout outcome "Spend the meeting on the idea—not on aligning shapes." [body="Finch.js turns presentation structure into a reusable, versionable artifact." width=720]

row tags [gap=12] {
  badge docs "DOCUMENTATION"
  badge pitches "PITCHES"
  badge workshops "WORKSHOPS"
  badge reviews "DESIGN REVIEWS"
}
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(slideSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
