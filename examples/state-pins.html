<!doctype html><html lang="ja"><meta charset="utf-8"><title>State boundary pins — Finch.js</title>
<style>body{font:15px sans-serif;background:#f3f6fb;padding:32px}main{background:white;padding:24px;max-width:1000px;margin:auto}</style>
<main><h1>状態図の境界ピン</h1><p>四角は表示拡張の入力・出力ピンです。UMLの丸いentryPoint／exitPointとは別種別として保持します。</p><div id="pins"></div></main>
<script src="../dist/finch.global.js"></script><script>
const pinSource = `@state validation=strict
state pending "待機中"
state session "セッション" {
 inputPin incoming "入力"
 state active "処理中"
 outputPin outgoing "出力"
 incoming -> active
 active -> outgoing
}
state completed "処理済み"
pending -> incoming: submit
outgoing -> completed: delivered`;
Finch.render(pinSource,{target:'#pins'});
</script></html>
