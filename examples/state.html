<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js advanced state example</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="State">
    <header>
      <a class="back" href="./index.html">← All examples</a>
      <span class="eyebrow">@state</span>
      <h1>Advanced state</h1>
      <p>Cyclic review transitions with cancellation and a semantic resolution junction.</p>
    </header>
    <main class="diagram-layout">
      <section id="diagram" class="canvas" aria-label="State diagram output"></section>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="../dist/finch.global.js?v=0.5.1-examples-2"></script>
    <script>
      const stateSource = String.raw`
@state validation=strict

initial start
state draft "Draft"
state review "In review"
choice decision
state changes "Changes requested"
state approved "Approved"
state rejected "Rejected"
state cancelled "Cancelled"
junction resolved
fork publish
state persistence "Persist outcome" {
 region logging "Logging" {
  state audit "Write audit log"
 }
 region storage "Storage" {
  state archiving "Archiving outcome"
 }
}
join published
final done

start -> draft
draft -> review: submit
review -> changes: request changes
changes -> draft: revise
review -> decision
decision -> approved [approved] / accept
decision -> rejected [rejected] / decline
draft -> cancelled: cancel
changes -> cancelled: cancel
approved -> resolved
rejected -> resolved
cancelled -> resolved
resolved -> publish: / persist outcome
publish -> archiving
publish -> audit
archiving -> published
audit -> published
published -> done
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(stateSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
