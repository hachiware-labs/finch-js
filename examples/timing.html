<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>タイミング図 — Finch.js</title>
<style>body{background:#f3f6fb;color:#24334b;font:15px Segoe UI,Meiryo,sans-serif;margin:0}main{max-width:1120px;margin:auto;padding:32px}section{background:white;padding:24px;border-radius:12px;margin:24px 0}.diagram{overflow:auto}</style>
<main><h1>時間軸で振る舞いを比べる</h1><p>状態、処理区間、信号、負荷、クロックを同じ時間軸に並べます。行はドラッグで移動できます。</p>
<section><h2>リクエスト処理と負荷の変化</h2><div id="timing" class="diagram" aria-label="リクエスト処理のタイミング図"></div></section><section><h2>名前付き時刻と不確定な信号</h2><p>破線の帯は値が確定していない範囲、空白は信号を表示しない区間です。</p><div id="uncertain" class="diagram" aria-label="時間アンカーと未確定信号"></div></section></main>
<script src="../dist/finch.global.js"></script><script>
const timingSource = `@timing end=200 scale=3.5 unit=ms
robust service "SERVICE"
concise worker "WORKER"
binary busy "BUSY"
analog load "LOAD"
clock clk "CLOCK" [period=40 pulse=15]
@0
service is Idle
worker is Waiting
busy is low
load is 0
@40
service is Running
worker is Processing
busy is high
load is 35
service -> worker@+10: dispatch
@80
load is 85
@120
service is Saving
worker is Persisting
load is 60
@160
service is Idle
worker is Waiting
busy is low
load is 10
duration service 40 160 "120 ms / request"`;
Finch.render(timingSource,{target:'#timing'});
const uncertainSource = `@timing end=100 scale=7 unit=ms
binary enable "ENABLE"
robust bus "DATA BUS"
@20 as :start
@70 as :resume
@enable
0 is low
:start is {low,high}
+20 is {hidden}
:resume is high
@bus
0 is Idle
:start is {Idle,Valid}
+20 is {hidden}
:resume is Valid
duration enable :start :resume "settling / disconnected"`;
Finch.render(uncertainSource,{target:'#uncertain'});
</script></html>
