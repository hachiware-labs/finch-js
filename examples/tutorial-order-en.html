<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Order flow and out-of-stock branch</title><style>body{font:16px system-ui;margin:32px;color:#21334a}#diagram{width:max-content;min-width:500px;padding:24px;border:1px solid #dbe4ec}svg{display:block;max-width:none!important}</style><h1>Order flow and out-of-stock branch</h1><p>Keep the normal path aligned and the out-of-stock branch separate. Open the editor from the lower-left icon.</p><div id="diagram"></div><script src="../dist/finch.global.js"></script><script>const orderFlowSource=`
@flowchart
start received "Order received"
process validate "Check inventory"
decision available "In stock?"
process reserve "Reserve items"
end confirmed "Order confirmed"
end backorder "Await restock"

received -> validate
validate -> available
available -> reserve: Yes
available -> backorder: No
reserve -> confirmed
      `;const diagram=Finch.render(orderFlowSource,{target:'#diagram'});diagram.svg.style.width=diagram.geometry.width+'px';diagram.svg.style.height=diagram.geometry.height+'px';</script></html>
