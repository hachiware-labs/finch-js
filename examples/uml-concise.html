<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡潔なUML — Finch.js</title>
<style>body{margin:0;background:#f4f7fb;color:#23334a;font:15px Segoe UI,Meiryo,sans-serif}main{max-width:1280px;margin:auto;padding:28px}section{background:white;padding:24px;margin:24px 0;border:1px solid #d4deea;border-radius:12px}.diagram{overflow:auto}.diagram>svg{display:block;min-width:600px}pre{white-space:pre-wrap;background:#f5f7fb;padding:16px}a{color:#246e99}</style>
<main><a href="./index.html">← Examples</a><h1>少ない記述で、設計の意味を伝える</h1><p><a href="./uml-practical.html">シーケンス・状態内処理・ループなどの追加サンプル →</a></p><p>注釈・条件分岐・複合状態・レーン・パッケージ。各図の鳥アイコンから編集できます。</p>
<section><h2>分岐と注釈</h2><div id="sequence" class="diagram"></div></section>
<section><h2>入れ子と並行領域</h2><div id="state" class="diagram"></div></section>
<section><h2>担当ごとのレーン</h2><div id="activity" class="diagram"></div></section>
<section><h2>パッケージと制約</h2><div id="class" class="diagram"></div></section></main>
<script src="../dist/finch.global.js"></script><script>
const sequenceSource = `@sequence
actor user "利用者"
participant api "注文API"
participant stock "在庫"
user -> api: 注文
alt 在庫あり
 api -> stock: 引き当て [id=reserve]
 stock --> api: 確保済み
 api --> user: 受付完了
else 在庫なし
 api --> user: 入荷待ち
end
par 完了通知
 api -> user: メール
and 記録
 api -> stock: 監査記録
end
note reserve "引き当ては冪等にする"`;
Finch.render(sequenceSource,{target:'#sequence'});
const stateSource = `@state
initial begin
state processing "処理中" {
 region payment "決済" {
  initial p0
  state charged "決済済み"
  final p1
  p0 -> charged
  charged -> p1
 }
 region delivery "配送" {
  initial d0
  state packed "梱包済み"
  final d1
  d0 -> packed
  packed -> d1
 }
}
final done
begin -> processing
processing -> done: 両方完了
constraint processing "決済と配送の両方を完了"`;
Finch.render(stateSource,{target:'#state'});
const activitySource = `@activity
lane customer "利用者" {
 start begin
 action submit "注文する"
 action receive "結果を受け取る"
 end done
}
lane service "注文サービス" {
 action validate "内容を検証"
 decision available "在庫あり？"
 action reserve "在庫を確保"
 action reject "入荷待ちを案内"
 merge result
}
begin -> submit
submit -> validate
validate -> available
available -> reserve [yes]
available -> reject [no]
reserve -> result
reject -> result
result -> receive
receive -> done`;
Finch.render(activitySource,{target:'#activity'});
const classSource = `@class
package domain "ドメイン" {
 class Order {
  -id: UUID
  +confirm(): void
 }
 class Item {
  -quantity: int
 }
 Order "1" *-- "1..*" Item: items
}
package app "アプリケーション" {
 class Checkout {
  +execute(): void
 }
}
Checkout ..> Order: confirms
constraint Item "quantity > 0"
note Order "確定後は明細を変更しない"`;
Finch.render(classSource,{target:'#class'});
for(const [id,source] of Object.entries({sequence:sequenceSource,state:stateSource,activity:activitySource,class:classSource})) {
 const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='ソースを見る';const pre=document.createElement('pre');pre.textContent=source;details.append(summary,pre);document.getElementById(id).parentElement.append(details);
}
</script></html>
