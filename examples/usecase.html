<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finch.js UML use case example</title><link rel="stylesheet" href="./example.css" />
  </head>
  <body class="diagram-page" data-title="Use case">
    <header><a class="back" href="./index.html">← All examples</a><span class="eyebrow">@usecase</span><h1>UML use case diagram</h1><p>Actors, system boundaries, include, extend, and actor generalization.</p></header>
    <main class="diagram-layout"><section id="diagram" class="canvas" aria-label="Use case diagram output"></section><p id="error" class="error" hidden></p></main>
    <script src="../dist/finch.global.js?v=0.5.1-uml-1"></script>
    <script>
      const useCaseSource = String.raw`
@usecase

actor customer "Customer"
actor member "Registered Customer"
actor operator "Store Operator"
actor payments "Payment Provider"

system commerce "Commerce Platform" {
  usecase browse "Browse catalog"
  usecase checkout "Checkout"
  usecase authenticate "Authenticate"
  usecase coupon "Apply coupon"
  usecase pay "Authorize payment"
  usecase refund "Issue refund"
  usecase manage "Manage catalog"
}

generalize member -> customer
customer -> browse
customer -> checkout
member -> coupon
operator -> refund
operator -> manage
payments -> pay
include checkout -> authenticate
include checkout -> pay
extend coupon -> checkout
include refund -> authenticate
      `.trim();

      const title = document.body.dataset.title ?? "Diagram";
      const diagram = document.querySelector("#diagram");
      const errorView = document.querySelector("#error");
      let instance;

      try {
        instance = Finch.render(useCaseSource, {
          target: diagram,
          ariaLabel: `${title} advanced example`,
        });
      } catch (error) {
        errorView.hidden = false;
        errorView.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
