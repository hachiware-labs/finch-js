      .finch-canvas.is-panning { cursor: grabbing; user-select: none; }
      .finch-canvas.is-panning .finch-node { cursor: grabbing; }
      .finch-edge { pointer-events: none; }
      .finch-activation { pointer-events: none; }
      .finch-edge-label { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .finch-cardinality { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
      .finch-canvas:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
