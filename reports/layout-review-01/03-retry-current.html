<!doctype html><html lang="ja"><meta charset="utf-8"><title>再試行ループ | Finch評価01</title><style>body{font:16px system-ui;margin:32px;color:#172b3a}a{color:#125ea5}.frame{overflow:auto;border:1px solid #dbe2e8;padding:24px;width:max-content;min-width:600px}svg{display:block}p{max-width:1000px}</style><a href="index.html">← 採点一覧</a><p>現行実装による自動配置。<a href="03-retry.html">初回配置を開く</a></p><h1>03-retry 再試行ループ</h1><p>観察対象：戻り線と順方向の分離。架空の評価用モデル／初期自動配置／既定テーマ・既定ルーティング。手動座標なし。</p><div class="frame" id="diagram"></div><script src="../../dist/finch.global.js"></script><script>const diagramSource = `@flowchart
