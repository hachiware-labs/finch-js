<!doctype html><html lang="ja"><meta charset="utf-8"><title>並列状態 | Finch評価01</title><style>body{font:16px system-ui;margin:32px;color:#172b3a}a{color:#125ea5}.frame{overflow:auto;border:1px solid #dbe2e8;padding:24px;width:max-content;min-width:600px}svg{display:block}p{max-width:1000px}</style><a href="index.html">← 採点一覧</a><h1>04-parallel 並列状態</h1><p>観察対象：fork・joinの上下配置。架空の評価用モデル／初期自動配置／既定テーマ・既定ルーティング。手動座標なし。</p><div class="frame" id="diagram"></div><script src="./finch.snapshot.js"></script><script>const diagramSource = `@state
initial s
fork f
state a "在庫確保"
state b "決済認証"
state c "配送先確認"
join j
state d "注文確定"
final e
s -> f
f -> a
f -> b
f -> c
a -> j
b -> j
c -> j
j -> d
d -> e`;window.instance=Finch.render(diagramSource,{target:'#diagram',editor:true});instance.svg.style.width=instance.geometry.width+'px';instance.svg.style.height=instance.geometry.height+'px';instance.svg.style.maxWidth='none';</script></html>
