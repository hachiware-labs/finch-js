<!doctype html><html lang="ja"><meta charset="utf-8"><title>入れ子の配置図 | Finch評価01</title><style>body{font:16px system-ui;margin:32px;color:#172b3a}a{color:#125ea5}.frame{overflow:auto;border:1px solid #dbe2e8;padding:24px;width:max-content;min-width:600px}svg{display:block}p{max-width:1000px}</style><a href="index.html">← 採点一覧</a><p>現行実装の比較候補：入口をlayout=columnに変更。購読はQueueの右からWorkerの下へ接続する指定を追加。配置座標は指定していません。 <a href="06-deployment.html">初回配置と比較</a></p><h1>06-deployment 入れ子の配置図</h1><p>観察対象：境界越えと共有データ接続。架空の評価用モデル／新方針の比較候補／既定テーマ・既定ルーティング。手動座標なし。</p><div class="frame" id="diagram"></div><script src="../../dist/finch.global.js"></script><script>const diagramSource = `@deployment
container cloud "本番環境" [layout=column] {
 container front "入口" [layout=column] {
  node cdn "CDN"
  node gw "Gateway"
 }
 container apps "アプリケーション" [layout=row] {
  server api "注文API"
  server worker "非同期Worker"
 }
 container data "データ層" [layout=row] {
  database db "注文DB"
  node queue "Queue"
 }
}
cdn -> gw: HTTPS
gw -> api: 転送
api -> db: 保存
api -> queue: 配信
queue -> worker: 購読 [fromPort=right toPort=bottom]
worker -> db: 更新`;window.instance=Finch.render(diagramSource,{target:'#diagram',editor:true});instance.svg.style.width=instance.geometry.width+'px';instance.svg.style.height=instance.geometry.height+'px';instance.svg.style.maxWidth='none';</script></html>
