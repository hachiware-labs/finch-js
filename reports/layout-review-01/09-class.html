<!doctype html><html lang="ja"><meta charset="utf-8"><title>継承と関連 | Finch評価01</title><style>body{font:16px system-ui;margin:32px;color:#172b3a}a{color:#125ea5}.frame{overflow:auto;border:1px solid #dbe2e8;padding:24px;width:max-content;min-width:600px}svg{display:block}p{max-width:1000px}</style><a href="index.html">← 採点一覧</a><h1>09-class 継承と関連</h1><p>観察対象：異なる線種と継承階層。架空の評価用モデル／初期自動配置／既定テーマ・既定ルーティング。手動座標なし。</p><div class="frame" id="diagram"></div><script src="./finch.snapshot.js"></script><script>const diagramSource = `@class

}

}
