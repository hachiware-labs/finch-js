<!doctype html><html lang="ja"><meta charset="utf-8"><title>複数の構造と横断依存</title><style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style><h1>複数の構造と横断依存</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details><script src="../../dist/finch.global.js"></script><script>
const source = `@class
class Document
class Report
class Page
interface Store
class SqlStore
interface Notifier
class Mailer
class Workflow
Report --|> Document
Report *-- Page
SqlStore ..|> Store
Mailer ..|> Notifier
Workflow ..> Report
Workflow ..> Store
Workflow ..> Notifier
SqlStore ..> Report`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
