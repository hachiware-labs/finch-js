<!doctype html><html lang="ja"><meta charset="utf-8"><title>共通インターフェースへの集中</title><style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style><h1>共通インターフェースへの集中</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details><script src="../../dist/finch.global.js"></script><script>
const source = `@class
interface Plugin
class Csv
class Json
class Xml
class Pdf
class Html
class Registry
Csv ..|> Plugin
Json ..|> Plugin
Xml ..|> Plugin
Pdf ..|> Plugin
Html ..|> Plugin

Registry ..> Pdf

document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
