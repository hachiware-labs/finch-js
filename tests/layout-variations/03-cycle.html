<!doctype html><html lang="ja"><meta charset="utf-8"><title>依存の循環と双方向</title><style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style><h1>依存の循環と双方向</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details><script src="../../dist/finch.global.js"></script><script>
const source = `@class
class Editor
class Model
class History
class Validator
