<!doctype html><html lang="ja"><meta charset="utf-8"><title>5つの継承系列</title><style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style><h1>5つの継承系列</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details><script src="../../dist/finch.global.js"></script><script>
const source = `@class
interface A
interface B
interface C
interface D
interface E
class A1
class B1
class C1
class D1
class E1
A1 ..|> A
B1 ..|> B
C1 ..|> C
D1 ..|> D
E1 ..|> E
A1 ..> B1
B1 ..> C1
C1 ..> D1
D1 ..> E1
E1 ..> A1`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
