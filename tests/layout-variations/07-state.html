<!doctype html><html lang="ja"><meta charset="utf-8"><title>状態の往復と自己遷移</title><style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style><h1>状態の往復と自己遷移</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details><script src="../../dist/finch.global.js"></script><script>
const source = `@state
initial begin
state idle "Idle"
state active "Active"
state paused "Paused"
state failed "Failed"
final done
begin -> idle
idle -> active: start
active -> paused: pause
paused -> active: resume
active -> failed: failure
failed -> active: retry
active -> active: refresh
active -> done: finish
paused -> idle: cancel`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
