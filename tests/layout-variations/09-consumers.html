<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>複数の共通利用側</title>
<style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style>
<a href="index.html">配置バリエーション一覧</a><h1>複数の共通利用側</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details>
<script src="../../dist/finch.global.js"></script><script>
const source = `@class
interface Store
class SqlStore
interface Sender
class Mailer
class Document
class Report
class Page
class Checkout
class ExportJob
SqlStore ..|> Store
Mailer ..|> Sender
Report --|> Document
Report *-- Page
SqlStore ..> Report
Checkout ..> Store
Checkout ..> Sender
Checkout ..> Report
ExportJob ..> Store
ExportJob ..> Sender
ExportJob ..> Report`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
