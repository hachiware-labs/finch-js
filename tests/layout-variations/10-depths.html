<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>深さと枝数が異なる系列</title>
<style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style>
<a href="index.html">配置バリエーション一覧</a><h1>深さと枝数が異なる系列</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details>
<script src="../../dist/finch.global.js"></script><script>
const source = `@class
class Asset
class Document
class Report
class Invoice
class Page
interface Storage
class LocalStore
class RemoteStore
interface Renderer
class PdfRenderer
class PreviewRenderer
class PublishJob
Document --|> Asset
Report --|> Document
Invoice --|> Document
Report *-- Page
LocalStore ..|> Storage
RemoteStore ..|> Storage
PdfRenderer ..|> Renderer
PreviewRenderer ..|> Renderer
PdfRenderer ..> Report
RemoteStore ..> Document
PublishJob ..> Storage
PublishJob ..> Renderer
PublishJob ..> Report`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
