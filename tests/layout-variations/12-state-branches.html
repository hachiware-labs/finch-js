<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>同じ長さの状態経路と復帰</title>
<style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style>
<a href="index.html">配置バリエーション一覧</a><h1>同じ長さの状態経路と復帰</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details>
<script src="../../dist/finch.global.js"></script><script>
const source = `@state
initial begin
state ready "Ready"
state online "Online"
state offline "Offline"
state recovery "Recovery"
state stopped "Stopped"
final done
begin -> ready
ready -> online: connect
ready -> offline: work locally
online -> stopped: stop
offline -> stopped: stop
stopped -> done
online -> recovery: connection lost
recovery -> online: retry
recovery -> offline: fallback
offline -> online: reconnect
online -> online: heartbeat`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
