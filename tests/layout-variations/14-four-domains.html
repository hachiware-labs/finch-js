<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>4配備領域と共有監視</title>
<style>body{font:15px sans-serif;margin:24px;background:#f5f7fb}#diagram{background:white;overflow:auto}pre{white-space:pre-wrap}</style>
<a href="index.html">配置バリエーション一覧</a><h1>4配備領域と共有監視</h1><div id="diagram"></div><details><summary>ソース</summary><pre id="source"></pre></details>
<script src="../../dist/finch.global.js"></script><script>
const source = `@deployment
container ingress "Ingress" {
 server gateway "Gateway"
 server auth "Auth"
}
container app "Application" {
 server api "API"
 server worker "Worker"
}
container data "Data" {
 database db "Database"
 server queue "Queue"
}
container ops "Operations" {
 server logs "Logs"
 server monitor "Monitor"
}
gateway -> auth
gateway -> api
api -> db
api -> queue
queue -> worker
worker -> db
gateway --> logs
api --> logs
worker --> logs
monitor -> gateway
monitor -> api
monitor -> db`;
document.querySelector("#source").textContent=source;
window.diagram=Finch.render(source,{target:"#diagram"});
</script></html>
